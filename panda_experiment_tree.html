const width = window.innerWidth;
const height = window.innerHeight - 100;
const dx = 26;
const dy = width / 7;

const tree = d3.tree().nodeSize([dx, dy]);
const diagonal = d3.linkHorizontal().x(d => d.y).y(d => d.x);

const svg = d3.select("#tree-svg")
  .attr("viewBox", [-100, -height/2, width, height]);

const gZoom = svg.append("g");
const gLink = gZoom.append("g")
    .attr("fill", "none")
    .attr("stroke", "#4a4f58")
    .attr("stroke-opacity", 0.7)
    .attr("stroke-width", 1.6);
const gNode = gZoom.append("g")
    .attr("cursor", "pointer")
    .attr("pointer-events", "all");

const zoomBehavior = d3.zoom()
  .scaleExtent([0.25, 2.5])
  .on("zoom", (event) => gZoom.attr("transform", event.transform));
svg.call(zoomBehavior);

const root = d3.hierarchy(treeData);
root.x0 = 0;
root.y0 = 0;

// Start with depth <=1 expanded, everything below collapsed
root.descendants().forEach((d, i) => {
  d.id = i;
  d._children = d.children;
  if (d.depth >= 2) {
    d.children = null;
  }
});

const tooltip = document.getElementById("tooltip");

function showTooltip(event, d) {
  if (!d.data.desc) { tooltip.style.display = "none"; return; }
  const c = statusColor[d.data.status] || "#888";
  tooltip.innerHTML = `
    <div class="tt-name">${d.data.name}</div>
    <div class="tt-status" style="background:${c}22;color:${c};border:1px solid ${c}">${statusLabel[d.data.status] || d.data.status}</div>
    <div>${d.data.desc}</div>
  `;
  tooltip.style.display = "block";
  tooltip.style.left = (event.clientX + 16) + "px";
  tooltip.style.top = (event.clientY + 8) + "px";
}
function hideTooltip() { tooltip.style.display = "none"; }

function update(source) {
  const duration = 300;
  const nodes = root.descendants().reverse();
  const links = root.links();

  tree(root);

  let left = root, right = root;
  root.eachBefore(node => {
    if (node.x < left.x) left = node;
    if (node.x > right.x) right = node;
  });
  const heightNeeded = right.x - left.x + 80;

  svg.transition().duration(duration)
     .attr("viewBox", [-100, left.x - 40, width, Math.max(heightNeeded, height)]);

  const node = gNode.selectAll("g.node")
    .data(nodes, d => d.id);

  const nodeEnter = node.enter().append("g")
      .attr("class", "node")
      .attr("transform", d => `translate(${source.y0},${source.x0})`)
      .attr("fill-opacity", 0)
      .attr("stroke-opacity", 0)
      .on("click", (event, d) => {
        d.children = d.children ? null : d._children;
        update(d);
      })
      .on("mouseover", showTooltip)
      .on("mousemove", showTooltip)
      .on("mouseout", hideTooltip);

  nodeEnter.append("circle")
      .attr("r", d => d.depth === 0 ? 8 : (d._children ? 6.5 : 4.5))
      .attr("fill", d => statusColor[d.data.status] || "#888")
      .attr("stroke", d => d._children ? "#fff" : "none")
      .attr("stroke-opacity", d => d._children ? 0.5 : 0);

  nodeEnter.append("text")
      .attr("dy", "0.31em")
      .attr("x", d => d._children ? -10 : 10)
      .attr("text-anchor", d => d._children ? "end" : "start")
      .text(d => d.data.name)
      .attr("font-weight", d => d.depth <= 1 ? 700 : 400);

  const nodeUpdate = node.merge(nodeEnter).transition().duration(duration)
      .attr("transform", d => `translate(${d.y},${d.x})`)
      .attr("fill-opacity", 1)
      .attr("stroke-opacity", 1);

  nodeUpdate.select("circle")
      .attr("r", d => d.depth === 0 ? 8 : (d._children ? 6.5 : 4.5))
      .attr("stroke", d => d._children ? "#fff" : "none")
      .attr("stroke-opacity", d => d._children ? 0.5 : 0);

  const nodeExit = node.exit().transition().duration(duration).remove()
      .attr("transform", d => `translate(${source.y},${source.x})`)
      .attr("fill-opacity", 0)
      .attr("stroke-opacity", 0);

  const link = gLink.selectAll("path.link")
    .data(links, d => d.target.id);

  const linkEnter = link.enter().append("path")
      .attr("class", "link")
      .attr("d", d => {
        const o = {x: source.x0, y: source.y0};
        return diagonal({source: o, target: o});
      });

  link.merge(linkEnter).transition().duration(duration)
      .attr("d", diagonal);

  link.exit().transition().duration(duration).remove()
      .attr("d", d => {
        const o = {x: source.x, y: source.y};
        return diagonal({source: o, target: o});
      });

  root.eachBefore(d => { d.x0 = d.x; d.y0 = d.y; });
}

update(root);

document.getElementById("expand-all").addEventListener("click", () => {
  root.eachBefore(d => { if (d._children) d.children = d._children; });
  update(root);
});
document.getElementById("collapse-all").addEventListener("click", () => {
  root.eachBefore(d => { if (d.depth >= 1 && d._children) d.children = null; });
  update(root);
});
document.getElementById("reset-view").addEventListener("click", () => {
  svg.transition().duration(400).call(zoomBehavior.transform, d3.zoomIdentity);
  update(root);
});
</script>
</body>
</html>
